name: login_app
description: A new Flutter project with a beautiful login UI.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.4.1
  flutter_svg: ^2.2.0
  provider: ^6.1.5
  flutter_local_notifications: ^19.3.1
  timezone: ^0.10.1
  intl: ^0.20.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  path: ^1.9.1
  flutter_dotenv: ^5.2.1

  location: ^8.0.1
  permission_handler: ^12.0.1
  razorpay_flutter: ^1.3.7
  connectivity_plus: ^6.1.4
  firebase_core: ^3.15.1
  firebase_database: ^11.3.9
  firebase_auth: ^5.6.2  # For authentication
  cloud_firestore: ^5.6.11  # For database
  firebase_storage: ^12.4.9  # For storing files
  firebase_messaging: ^15.2.9  # For push notification
  url_launcher: ^6.3.2
  workmanager: ^0.7.0  # For background tasks - Latest compatible with current Flutter SDK

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0  # Compatible with current Flutter SDK

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
