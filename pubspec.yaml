name: login_app
description: A new Flutter project with a beautiful login UI.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  shared_preferences: ^2.1.1
  flutter_svg: ^2.0.5
  provider: ^6.0.5
  flutter_local_notifications: ^14.0.1
  timezone: ^0.9.2
  intl: 0.19.0
  sqflite: ^2.2.8+4
  path_provider: ^2.0.15
  share_plus: ^7.0.0
  path: ^1.8.3
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  flutter_background_service_ios: ^5.0.0
  location: ^5.0.3
  permission_handler: ^11.3.0
  razorpay_flutter: ^1.3.5
  connectivity_plus: ^5.0.1
  firebase_core: ^2.7.0
  firebase_database: ^10.0.15
  firebase_auth: ^4.9.0  # For authentication
  cloud_firestore: ^4.9.1  # For database
  firebase_storage: ^11.2.6  # For storing files
  firebase_messaging: ^14.6.7  # For push notification
  url_launcher: ^6.1.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700